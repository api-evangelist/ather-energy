apis:
- name: Ather Shop — UCP Shopping Service (MCP)
  description: 'The only machine-callable API surface Ather Energy exposes. Ather''s
    commerce host advertises a Universal Commerce Protocol merchant profile at
    /.well-known/ucp declaring an MCP shopping endpoint under the merchant identity
    "Ather Shop" (merchant_origin shop.atherenergy.com), with capabilities for catalog
    search and lookup, cart, checkout, fulfillment, discount and order, plus Google Pay
    and Shopify card payment handlers. The MCP server is provided by the Shopify
    platform; the merchant profile, catalog, payment configuration and host are Ather''s.
    Anonymous tools/list is refused (HTTP 422, invalid_profile_url) — a registered UCP
    agent profile URI is required. Checkout completion requires explicit buyer approval.'
  humanURL: https://shop.atherenergy.com/agents.md
  baseURL: https://shop.atherenergy.com/api/ucp/mcp
