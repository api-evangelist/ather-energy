aid: ather-energy
name: Ather Energy
description: 'Ather Energy Limited is a Bengaluru-based Indian electric two-wheeler
  manufacturer founded in 2013 by Tarun Mehta and Swapnil Jain. It designs and builds
  connected electric scooters — the Ather 450 series (450S, 450X, 450 Apex) and the
  family-oriented Rizta — around AtherStack, its proprietary in-house vehicle software
  architecture delivered to vehicles over the air. Ather also operates Ather Grid,
  India''s largest two-wheeler fast-charging network, alongside a retail, service,
  accessories and smart-helmet ecosystem. Ather publishes no public developer API,
  OpenAPI, GraphQL or MCP surface: its machine-readable public footprint is a curated
  llms.txt for AI agents, a named-crawler robots.txt allowlist, and an open-source
  GitHub organisation of embedded and infrastructure libraries (ACAN, ASDK, rumqtt).'
