  api_client_sdks: 0
  note: >-
    Ather Energy publishes NO public API and therefore NO API client SDKs. What the
    company does publish on public registries is first-party open-source engineering
    tooling from its GitHub organisation (github.com/AtherEnergy) — embedded systems
    libraries, an MQTT client, and a data-visualisation package. These are genuine
    first-party packages but they are NOT client libraries for an Ather API, so no
    `SDKs` pointer is wired in apis.yml (doing so would misrepresent the ergonomics
    of a non-existent developer API).
